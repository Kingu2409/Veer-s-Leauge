function netMsg(e){
  let m;try{m=JSON.parse(e.data);}catch(x){return;}
  switch(m.t){
    case 'room':
      NET.code=m.code;NET.you=m.you;NET.names=m.names;
      if(UI.screen==='onlineWait')refresh();else if(UI.screen!=='match'&&UI.screen!=='result')go('onlineWait',{});
      break;
    case 'toss':NET.you=m.you;NET.names=m.names;NET.toss={winner:m.winner};M=null;go('onlineToss');break;
    case 'start':{
      NET.you=m.you;NET.names=m.names;
      const sides=m.names.map((n,i)=>({name:n,code:(n.replace(/[^A-Za-z0-9]/g,'').slice(0,3).toUpperCase()||'P'),human:true,t:null,c1:i?'#4da3ff':'#f2c14e',c2:i?'#12396b':'#8a6410'}));
      M=createMatch({mode:'online',sides,overs:m.overs,wkts:m.wkts,diff:'medium',battingFirst:m.first});
      M.label='Online match';M.me=m.you;
      Snd.play('click');go('match');break;}
    case 'locked':if(UI.screen==='match'&&UI.busy)setComm('Your opponent has locked in too. Revealing...','Online');else if(UI.screen==='match')setComm('Your opponent has locked in. Your turn.','Online');break;
    case 'ball':onNetBall(m);break;
    case 'rematch-wait':toast('Waiting for your opponent to accept the rematch');break;
    case 'opp-left':
      if(M&&M.mode==='online'&&!M.done){confirmBox('Opponent left','Your opponent left the match.',[{label:'Back to menu',fn:()=>{NET.send({t:'leave'});netCloseSocket();M=null;go('menu');}}]);}
      else if(UI.screen==='result'){toast('Your opponent left');const b=$('#rmBtn');if(b){b.disabled=true;b.textContent='Opponent left';}}
      else if(UI.screen==='onlineWait'||UI.screen==='onlineToss'){UI.form.err='Your opponent left.';go('onlineHome');}
      break;
    case 'err':UI.form.err=m.msg||'Something went wrong.';if(UI.screen==='onlineWait'||UI.screen==='onlineHome'){go('onlineHome');}else toast(UI.form.err);break;
  }
}
function onNetBall(m){
  if(!M||M.mode!=='online'||UI.screen!=='match'||M.done) return;
  if(M.break){M.break=false;closeModal();}
  const meBat=M.innings[M.cur].bat===NET.you,info=chaseInfo(M);
  const tense=info.chasing&&info.ballsLeft===1&&info.need>0,prev=M.innings[M.cur].runs;
  const ev=playBall(M,m.bat,m.bowl);if(!ev) return;
  ev.tense=tense;ev.prev=prev;ev.hb=meBat;ev.humanN=meBat?m.bat:m.bowl;
  UI.busy=true;runReveal(ev);updatePad();
}

  ensurePlayoffs(L);

    const fx=L.fixtures.find(f=>!f.done&&(f.a===L.team||f.b===L.team));
    if(!fx){persist();go('dashboard');return;}
    simAIFixtures(L,fx.round-1);persist();
    startLeagueToss({fx});
  }else if(L.stage==='playoffs'){
    const m=nextPlayoff(L);if(!m){go('dashboard');return;}
    if(involves(L,m)) startLeagueToss({po:m});
    else{
      simPlayoff(L,m);
      L.note=`${PO_NAMES[m.id]}: ${TEAMS[m.res.win].name} won${m.res.so?' in a Super Over':''}.`;
      ensurePlayoffs(L);persist();Snd.play('click');go(L.stage==='complete'?'season':'dashboard');
    }
  }
};
function startLeagueToss(o){

  L.note='';

}

/* =====================================================================
   16. INTRO (canvas stadium), INPUT WIRING, BOOT
   ===================================================================== */
let introRaf=0;
function startIntro(){
  const cv=$('#introCanvas');if(!cv) return;
  const cx=cv.getContext('2d');if(!cx) return;
  let W=0,H=0;
  const size=()=>{const d=Math.min(2,window.devicePixelRatio||1);W=cv.clientWidth||window.innerWidth;H=cv.clientHeight||window.innerHeight;cv.width=Math.round(W*d);cv.height=Math.round(H*d);cx.setTransform(d,0,0,d,0,0);};
  size();window.addEventListener('resize',size);
  const seats=Array.from({length:520},()=>({a:Math.random(),r:Math.random(),c:Math.random()}));
  const motes=Array.from({length:70},()=>({x:Math.random(),y:Math.random(),s:.4+Math.random()*1.5,v:.01+Math.random()*.03,p:Math.random()*6}));
  const towers=[[.09,.36],[.29,.25],[.71,.25],[.91,.36]];
  const trail=[];const t0=performance.now();let last=t0;
  const ease=x=>1-Math.pow(1-x,3);
  function frame(now){
    if(!document.body.contains(cv)){window.removeEventListener('resize',size);return;}
    const rm=reduced(),T=rm?6:(now-t0)/1000,dt=Math.min(.05,(now-last)/1000);last=now;
    cx.fillStyle='#03060d';cx.fillRect(0,0,W,H);
    const mx=W/2,hy=H*.66,rx=W*.64,ry=H*.36;
    const lv=towers.map((_,i)=>{const k=clamp((T-(.45+i*.42))/1.1,0,1);let v=ease(k);if(k>0&&k<1)v*=Math.sin(T*47+i*5)>-.25?1:.3;return v;});
    const avg=lv.reduce((a,b)=>a+b,0)/4;
    let g=cx.createLinearGradient(0,hy-ry,0,hy+ry*.4);g.addColorStop(0,'#0c162c');g.addColorStop(1,'#050a14');
    cx.fillStyle=g;cx.beginPath();cx.ellipse(mx,hy,rx,ry,0,0,Math.PI*2);cx.fill();
    seats.forEach(s=>{const an=s.a*Math.PI*2,rr=.5+s.r*.5,x=mx+Math.cos(an)*rx*rr,y=hy+Math.sin(an)*ry*rr;
      cx.fillStyle=`rgba(${170+s.c*70|0},${150+s.c*60|0},${130+s.c*40|0},${.06+.5*avg*(.3+.7*s.c)})`;cx.fillRect(x,y,2.2,2.2);});
    cx.fillStyle=`rgba(${10+37*avg|0},${28+130*avg|0},${20+73*avg|0},1)`;
    cx.beginPath();cx.ellipse(mx,hy+H*.06,W*.4,H*.14,0,0,Math.PI*2);cx.fill();
    cx.strokeStyle=`rgba(255,255,255,${.1+.35*avg})`;cx.lineWidth=2;cx.beginPath();cx.ellipse(mx,hy+H*.06,W*.4,H*.14,0,0,Math.PI*2);cx.stroke();
    cx.fillStyle=`rgba(214,186,130,${.12+.6*avg})`;cx.beginPath();cx.moveTo(mx-W*.012,hy-H*.03);cx.lineTo(mx+W*.012,hy-H*.03);cx.lineTo(mx+W*.035,hy+H*.15);cx.lineTo(mx-W*.035,hy+H*.15);cx.fill();
    cx.fillStyle=`rgba(246,231,193,${.2+.7*avg})`;[[-.007,-.03],[0,-.03],[.007,-.03]].forEach(([dx,dy])=>cx.fillRect(mx+W*dx-1,hy+H*dy-8,2,8));
    cx.globalCompositeOperation='lighter';
    towers.forEach(([tx,ty],i)=>{
      const x=W*tx,y=H*ty,l=lv[i];
      cx.globalCompositeOperation='source-over';cx.strokeStyle='#1b2740';cx.lineWidth=3;cx.beginPath();cx.moveTo(x,y+10);cx.lineTo(x,hy+ry*.15);cx.stroke();
      cx.fillStyle='#202c48';cx.fillRect(x-18,y-8,36,16);
      for(let a=0;a<3;a++)for(let b=0;b<2;b++){cx.fillStyle=`rgba(255,244,205,${.15+.85*l})`;cx.fillRect(x-15+a*11,y-6+b*7,8,5);}
      cx.globalCompositeOperation='lighter';
      const rg=cx.createRadialGradient(x,y,0,x,y,W*.2);rg.addColorStop(0,`rgba(255,240,190,${.55*l})`);rg.addColorStop(1,'rgba(255,240,190,0)');cx.fillStyle=rg;cx.beginPath();cx.arc(x,y,W*.2,0,Math.PI*2);cx.fill();
      const bg=cx.createLinearGradient(x,y,mx,hy+H*.1);bg.addColorStop(0,`rgba(255,240,190,${.13*l})`);bg.addColorStop(1,'rgba(255,240,190,0)');
      cx.fillStyle=bg;cx.beginPath();cx.moveTo(x-8,y);cx.lineTo(x+8,y);cx.lineTo(mx+W*(tx<.5?.34:-.34)+W*.12,hy+H*.18);cx.lineTo(mx+W*(tx<.5?.34:-.34)-W*.12,hy+H*.18);cx.fill();
    });
    motes.forEach(m=>{m.y-=m.v*dt*(rm?0:1);if(m.y<0){m.y=1;m.x=Math.random();}
      cx.fillStyle=`rgba(255,235,180,${.5*avg*(.5+.5*Math.sin(T*2+m.p))})`;cx.beginPath();cx.arc(m.x*W+Math.sin(T+m.p)*6,m.y*H,m.s,0,Math.PI*2);cx.fill();});
    cx.globalCompositeOperation='source-over';
    const cyc=(T-1.9)%7;
    if(T>1.9&&cyc<1.7&&!rm){
      const u=cyc/1.7,bx=-W*.05+u*W*1.1,by=H*.84-Math.sin(u*Math.PI)*H*.5,rad=7+W*.008;
      trail.push({x:bx,y:by});if(trail.length>16)trail.shift();
      trail.forEach((p,i)=>{cx.fillStyle=`rgba(255,90,100,${i/trail.length*.35})`;cx.beginPath();cx.arc(p.x,p.y,rad*(i/trail.length),0,Math.PI*2);cx.fill();});
      const bgd=cx.createRadialGradient(bx-rad*.3,by-rad*.3,1,bx,by,rad);bgd.addColorStop(0,'#ff8a93');bgd.addColorStop(.6,'#d1202f');bgd.addColorStop(1,'#6e0b16');
      cx.fillStyle=bgd;cx.shadowColor='rgba(255,70,90,.9)';cx.shadowBlur=18;cx.beginPath();cx.arc(bx,by,rad,0,Math.PI*2);cx.fill();cx.shadowBlur=0;
      cx.strokeStyle='rgba(255,255,255,.7)';cx.lineWidth=1.4;cx.beginPath();cx.arc(bx,by,rad*.6,-.8,.8);cx.stroke();
    }else if(trail.length) trail.length=0;
    const vg=cx.createRadialGradient(mx,H*.5,Math.min(W,H)*.25,mx,H*.5,Math.max(W,H)*.75);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.6)');cx.fillStyle=vg;cx.fillRect(0,0,W,H);
    introRaf=requestAnimationFrame(frame);
  }
  introRaf=requestAnimationFrame(frame);
}
function endIntro(){
  const el=$('#intro');if(!el||el.dataset.done) return;

function boot(){
  Store.load();
  try{if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches)G.settings.reduced=true;}catch(e){}
  document.body.classList.toggle('reduced',!!G.settings.reduced);
  if(G.match&&G.match.mode==='league'){
    const L=G.league;
    const f=L&&(G.match.fixtureId!=null?L.fixtures.find(x=>x.id===G.match.fixtureId):L.po[G.match.poId]);
    if(!L||!f||(f.done&&!G.match.recorded)) G.match=null;
  }
  go('menu');
  startIntro();
}
window.__HC={G,TEAMS,ACT,UI,SCREENS,go,genFixtures,newLeague,computeTable,simMatch,createMatch,playBall,qualStatus,ensurePlayoffs,nextPlayoff,simPlayoff,simAIFixtures,simFixture,recordFixture,matchToRes,ovs,leagueMessage,validLeague,validMatch,Store,AI,aiChoose,chaseInfo,autoWkts,finalize,summarize,getM:()=>M,setM:m=>{M=m;},PO_ORDER};
boot();
